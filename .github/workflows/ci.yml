name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Layout
        run: |
          test -f wrangler.jsonc
          test -f package-lock.json
          test -f src/index.ts
          test -f src/tools/d1.ts
          test -f src/tools/r2.ts
          test -f src/tools/email.ts
          test -f src/auth/handler.ts
          test -f migrations/0002_fts_email.sql
